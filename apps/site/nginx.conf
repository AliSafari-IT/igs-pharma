# The IGS-Pharma landing page container: static files only, as an unprivileged user on :8080.
# Included as /etc/nginx/conf.d/default.conf in nginxinc/nginx-unprivileged.
#
# The security headers are the same values the edge sets for igs.asafarim.site (asafarim-os
# sites/asafarim-os.caddy), so the page is protected even when it is reached without the edge. Every
# add_header lives at server level: nginx drops inherited add_header lines in any location that has its own.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  charset utf-8;
  index index.html;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

  error_page 404 /404.html;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
