name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Obviously fake values — CI never needs real secrets.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
  AUTH_SECRET: ci-fake-auth-secret-not-a-real-secret-000
  AUTH_URL: http://localhost:3000
  PNPM_VERSION: "10.9.0"
  NODE_VERSION: "24"
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  # ── 1. Install ───────────────────────────────────────────────────────────────
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}

  # ── 2. Lint + format ─────────────────────────────────────────────────────────
  lint:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm biome ci .
      - run: pnpm lint:boundaries
      - run: pnpm test:boundaries
      - run: pnpm db:check

  # ── 3. Typecheck ─────────────────────────────────────────────────────────────
  typecheck:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run typecheck

  # ── 4. Unit tests ─────────────────────────────────────────────────────────────
  test:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run test

  # ── 5. Build ──────────────────────────────────────────────────────────────────
  build:
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build

  # ── 5b. Container images (build only; job 5c publishes them from main) ──────────
  # worker: build + smoke test (starts, logs JSON, exits 0 on SIGTERM; invalid env exits non-zero).
  # web/platform: confirm the Next standalone images still build.
  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [worker, web, platform]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # web image: the ASafariM OS manifest label (infra/docker/web.Dockerfile). Passed through the
      # environment (`build-args: APP_MANIFEST` with no value) so the action's CSV parsing never sees the JSON.
      - name: ASafariM OS manifest build arg
        run: echo "APP_MANIFEST=$(jq -c . apps/web/platform.app.json)" >> "$GITHUB_ENV"
      - name: Build ${{ matrix.image }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/${{ matrix.image }}.Dockerfile
          push: false
          load: true
          tags: igs-${{ matrix.image }}:ci
          build-args: ${{ matrix.image == 'web' && 'APP_MANIFEST' || '' }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Image size and user
        run: |
          size=$(docker image inspect igs-${{ matrix.image }}:ci --format '{{.Size}}')
          user=$(docker image inspect igs-${{ matrix.image }}:ci --format '{{.Config.User}}')
          echo "igs-${{ matrix.image }}: $((size / 1024 / 1024)) MiB, runs as '$user'" | tee -a "$GITHUB_STEP_SUMMARY"
          test -n "$user" && test "$user" != "root"
      - name: No secrets baked into the final image (D-023)
        run: |
          if docker history --no-trunc igs-${{ matrix.image }}:ci | grep -Eq "AUTH_SECRET|DATABASE_URL|AUTH_URL"; then
            echo "::error::final image history mentions build/runtime secrets"
            exit 1
          fi
          if docker image inspect igs-${{ matrix.image }}:ci --format '{{json .Config.Env}}' | grep -Eq "AUTH_SECRET|DATABASE_URL|AUTH_URL"; then
            echo "::error::final image ENV contains secrets"
            exit 1
          fi
      - name: Web image carries the ASafariM OS manifest label
        if: matrix.image == 'web'
        run: |
          label=$(docker image inspect igs-web:ci --format '{{ index .Config.Labels "org.asafarim.app.manifest" }}')
          echo "$label" | jq .
          echo "$label" | jq -e --slurpfile file apps/web/platform.app.json '. == $file[0]'
      # T-016: the worker loads the RBAC catalogue from the database at boot, so the smoke test
      # needs a migrated database (the seed migration); an unmigrated one stops it, by design.
      # #46: migrated by the image's own one-shot entry, as the server stack does; twice, because a
      # second run must be a no-op.
      - name: Migrate the CI database with the image's migrate entry
        if: matrix.image == 'worker'
        run: |
          for run in 1 2; do
            docker run --rm --network host -e NODE_ENV=test -e DATABASE_URL="$DATABASE_URL" \
              igs-worker:ci node dist/migrate.js | tee "migrate-$run.log"
          done
          grep -q "Database migrations applied" migrate-2.log
          grep -q "pg-boss schema up to date" migrate-2.log
      - name: Worker smoke test
        if: matrix.image == 'worker'
        run: |
          set -u
          # 1. invalid environment: non-zero exit and the readable Zod message
          set +e
          out=$(docker run --rm igs-worker:ci 2>&1); code=$?
          set -e
          echo "$out"
          test "$code" -ne 0
          echo "$out" | grep -q "Invalid environment configuration"
          # 2. valid environment: structured JSON log, stays up, clean exit on SIGTERM.
          # NODE_ENV=test only because this CI Postgres has no TLS (production forces TLS).
          docker run -d --name worker --network host \
            -e NODE_ENV=test \
            -e DATABASE_URL="$DATABASE_URL" \
            igs-worker:ci
          for i in $(seq 1 30); do
            docker logs worker 2>&1 | grep -q "waiting for jobs" && break
            sleep 1
          done
          docker logs worker
          docker logs worker 2>&1 | head -1 | jq -e '.msg == "Worker starting"'
          docker logs worker 2>&1 | grep -q "RBAC catalogue loaded"
          test "$(docker inspect -f '{{.State.Running}}' worker)" = "true"
          docker stop -t 15 worker
          test "$(docker inspect -f '{{.State.ExitCode}}' worker)" = "0"
      - name: Final image has no devDependencies
        if: matrix.image == 'worker'
        run: |
          docker run --rm --entrypoint sh igs-worker:ci -c \
            '! ls node_modules/.pnpm 2>/dev/null | grep -Eq "^(typescript|vitest|tsup|esbuild|tsx|@biomejs)"'

  # ── 5c. Publish images (main only, IGS-D6) ──────────────────────────────────────
  # After everything above is green on a push to main: the same three images, pushed to GHCR as
  # ghcr.io/alisafari-it/igs-pharma-<image>:<commit sha>. PR builds stay build-only (job 5b). The
  # server stack pins a sha and runs `node dist/migrate.js` from the worker image before the apps.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, docker, secrets-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [worker, web, platform]
    env:
      IMAGE: ghcr.io/alisafari-it/igs-pharma-${{ matrix.image }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: ASafariM OS manifest build arg
        run: echo "APP_MANIFEST=$(jq -c . apps/web/platform.app.json)" >> "$GITHUB_ENV"
      - name: Build ${{ matrix.image }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/${{ matrix.image }}.Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE }}
          # links the GHCR package to this repository (visibility and access follow the repo)
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: ${{ matrix.image == 'web' && 'APP_MANIFEST' || '' }}
          cache-from: type=gha,scope=${{ matrix.image }}
      - name: Web image carries the ASafariM OS manifest label
        if: matrix.image == 'web'
        run: |
          label=$(docker image inspect "$IMAGE" --format '{{ index .Config.Labels "org.asafarim.app.manifest" }}')
          echo "$label" | jq -e --slurpfile file apps/web/platform.app.json '. == $file[0]'
      - name: Push
        run: |
          docker push "$IMAGE"
          echo "pushed \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"

  # ── 6. Secret scanning ────────────────────────────────────────────────────────
  secrets-scan:
    runs-on: ubuntu-latest
    # gitleaks-action lists the PR's commits via the API (403 without pull-requests: read)
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
